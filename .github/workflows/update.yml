name: daily-update

on:
  schedule:
    - cron: "0 0 * * *"  # UTC 00:00 = 北京时间 08:00
    - cron: "0 6 * * *"  # UTC 06:00 = 北京时间 14:00
    - cron: "0 10 * * *" # UTC 10:00 = 北京时间 20:00
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-radar-daily-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch RSS
        run: node scripts/fetch_rss.mjs

      - name: Fetch GitHub trending
        run: node scripts/fetch_github.mjs

      - name: Fetch Bilibili
        run: node scripts/fetch_bilibili.mjs

      - name: Fetch jobs
        run: node scripts/fetch_jobs.mjs

      - name: AI curate & merge
        run: node scripts/curate.mjs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Install sharp (cover pipeline)
        run: npm install sharp --no-save

      - name: Fetch covers
        run: node scripts/covers.mjs

      - name: Build site
        run: node build.js

      - name: Commit updated data
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json site/index.html site/img
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "daily update $(date -u +%F)"
          git pull --rebase origin main
          for i in 1 2 3; do git push && break || sleep 10; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
